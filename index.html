<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

        .success { color: #28a745; font-size: 24px; margin-bottom: 20px; }

</head>
<body>
    <div class="message">
        <div class="success">✅ Vielen Dank!</div>
        <p>Ihr Termin wurde erfolgreich bestätigt.</p>
        <div class="loading">Sie werden weitergeleitet...</div>

    <script>
        // URL-Parameter auslesen
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        
        // Webhook aufrufen (wenn ID vorhanden)
        if (id) {
            const webhookUrl = 'https://hooks.zapier.com/hooks/catch/24703038/u1cqzzc/?id=' + id;
            fetch(webhookUrl, {method: 'GET', mode: 'no-cors'});
        }
        
        // Nach 3 Sekunden zur Interface-Dankesseite weiterleiten
        setTimeout(function() {
            window.location.href = 'https://new-interface-8ac433.zapier.app/page';
        }, 3000);
    </script>
